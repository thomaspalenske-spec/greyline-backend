[pytest]
# Scope collection to the real suite. Without this, a no-args `pytest` walks the repo root and pytest's
# default python_files (test_*.py AND *_test.py) collects stray dev SCRIPTS at the root — notably
# ts_live_test.py, which starts an HTTP server (serve_forever()) at import and HANGS collection forever,
# and test_schema.py, which just runs+prints. The actual test suite lives entirely under tests/.
testpaths = tests

# A hung/blocked test dumps every thread's traceback after this many seconds instead of hanging silently,
# so a future import/network stall is diagnosable at a glance rather than a 0%-CPU mystery.
faulthandler_timeout = 180
