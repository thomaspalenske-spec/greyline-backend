<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreyLine · Momentum-Reversal</title>
<style>
  :root{
    --bg:#0b1017; --panel:#121a24; --panel2:#0f1620; --line:#20303e;
    --ink:#e6edf3; --dim:#8b9bab; --faint:#5f7183;
    --accent:#5aa9e6; --up:#3fb37f; --down:#e0655c; --warn:#d6a94e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 20px 60px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  h1 small{color:var(--faint);font-weight:400;font-size:13px;margin-left:8px}
  .live{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint)}
  .live b{color:var(--up)}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 14px 12px}
  .kpi .l{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .kpi .v{font-family:ui-monospace,Menlo,monospace;font-size:21px;font-weight:600;line-height:1}
  .kpi .s{font-size:11px;color:var(--dim);margin-top:5px}
  .sec{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);margin:26px 0 12px;display:flex;align-items:center;gap:12px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  table{width:100%;border-collapse:collapse}
  th{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);text-align:right;padding:8px 12px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:10px 12px;border-bottom:1px solid var(--panel2);font-size:13.5px}
  tbody tr:hover{background:var(--panel2)}
  .tag{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600}
  .buy{color:var(--up);background:rgba(63,179,127,.12)}
  .sell{color:var(--down);background:rgba(224,101,92,.12)}
  .up{color:var(--up)} .down{color:var(--down)}
  .pill{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;
    padding:4px 11px;border-radius:20px;letter-spacing:.04em}
  .GREEN{color:var(--up);background:rgba(63,179,127,.14)}
  .AMBER{color:var(--warn);background:rgba(214,169,78,.14)}
  .RED{color:var(--down);background:rgba(224,101,92,.14)}
  .UNKNOWN,.WARMING_UP{color:var(--dim);background:rgba(139,155,171,.12)}
  .muted{color:var(--dim)} .r{text-align:right}
  .health{display:flex;gap:20px;flex-wrap:wrap;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px}
  .health .item{display:flex;flex-direction:column;gap:6px}
  .health .item .l{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint)}
  .health .why{color:var(--dim);font-size:12px;max-width:52ch}
  .empty{color:var(--faint);padding:18px 12px;font-style:italic}
  @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GreyLine <small>Momentum × Reversal · equity</small></h1>
    <div class="live">strategy <b id="live">●</b> · refreshed <span id="ts" class="mono">—</span></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="sec">Open positions <span id="mark" class="muted" style="text-transform:none;letter-spacing:0"></span></div>
  <table>
    <thead><tr><th>Symbol</th><th>Side</th><th class="r">Qty</th><th class="r">Entry</th>
      <th class="r">Current</th><th class="r">Notional</th><th class="r">Unrealized</th><th class="r">%</th></tr></thead>
    <tbody id="positions"></tbody>
  </table>

  <div class="sec">Current target book <span class="muted" style="text-transform:none;letter-spacing:0">what the signal wants to hold now</span></div>
  <table>
    <thead><tr><th>Rank</th><th>Symbol</th><th>Side</th><th class="r">Conviction</th>
      <th class="r">12-1 mom</th><th class="r">5d rev</th></tr></thead>
    <tbody id="targets"></tbody>
  </table>

  <div class="sec">Track record <span class="muted" style="text-transform:none;letter-spacing:0">does this strategy actually make money?</span></div>
  <div class="health" id="track"></div>

  <div class="sec">Data health</div>
  <div class="health" id="health"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const money = n => (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const cls = n => n>0?"up":n<0?"down":"muted";
async function j(u){const r=await fetch(u);return r.json();}

async function refresh(){
  try{
    const [reb,pos,strat,integ,perf] = await Promise.all([
      j("/momentum-reversal-rebalance"), j("/momentum-reversal-positions"),
      j("/momentum-reversal-strategy"), j("/data-integrity"), j("/strategy-performance")
    ]);

    $("live").style.color = pos.open_count>0 ? "var(--up)" : "var(--faint)";
    $("ts").textContent = new Date().toLocaleTimeString();
    $("mark").textContent = pos.marked_as_of ? "· marked to "+pos.marked_as_of+" ("+(pos.data_source||"")+")" : "";

    const cont = integ.continuity||{};
    $("kpis").innerHTML = [
      ["Open positions", pos.open_count ?? "—", money(pos.total_notional||0)+" notional"],
      ["Unrealized P&L", `<span class="${cls(pos.total_unrealized_pnl)}">${money(pos.total_unrealized_pnl||0)}</span>`, "marked to last close"],
      ["Realized P&L", `<span class="${cls(reb.realized_pnl||0)}">${money(reb.realized_pnl||0)}</span>`, "last rebalance"],
      ["Last rebalance", (reb.last_rebalance_at||"—").slice(0,10), "opened "+(reb.opened??"—")+" · closed "+(reb.closed??"—")],
      ["Data integrity", `<span class="pill ${integ.verdict||'UNKNOWN'}">${integ.verdict||'—'}</span>`, (integ.reasons&&integ.reasons[0]||"").slice(0,42)],
      ["Continuity", `<span class="pill ${cont.verdict||'UNKNOWN'}">${cont.verdict||'—'}</span>`, cont.currently_live?"live · "+(cont.uptime_pct??"—")+"% up":"—"],
    ].map(([l,v,s])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

    const P = pos.positions||[];
    $("positions").innerHTML = P.length ? P.map(p=>`<tr>
      <td><b>${p.symbol}</b></td>
      <td><span class="tag ${p.side==='BUY'?'buy':'sell'}">${p.side==='BUY'?'LONG':'SHORT'}</span></td>
      <td class="r mono">${p.quantity}</td><td class="r mono">${money(p.entry_price)}</td>
      <td class="r mono">${money(p.current_price)}</td><td class="r mono">${money(p.notional)}</td>
      <td class="r mono ${cls(p.unrealized_pnl)}">${money(p.unrealized_pnl)}</td>
      <td class="r mono ${cls(p.unrealized_pnl)}">${p.unrealized_pct>0?'+':''}${p.unrealized_pct}%</td></tr>`).join("")
      : `<tr><td colspan="8" class="empty">No open strategy positions.</td></tr>`;

    const T = strat.targets||[];
    $("targets").innerHTML = T.length ? T.map((t,i)=>`<tr>
      <td class="mono muted">${i+1}</td><td><b>${t.symbol}</b></td>
      <td><span class="tag ${t.side==='BUY'?'buy':'sell'}">${t.side==='BUY'?'LONG':'SHORT'}</span></td>
      <td class="r mono">${t.conviction}</td>
      <td class="r mono ${cls(t.momentum_12_1_pct)}">${t.momentum_12_1_pct>0?'+':''}${t.momentum_12_1_pct}%</td>
      <td class="r mono ${cls(-t.reversal_5d_move_pct)}">${t.reversal_5d_move_pct>0?'+':''}${t.reversal_5d_move_pct}%</td></tr>`).join("")
      : `<tr><td colspan="6" class="empty">No confirmed signals.</td></tr>`;

    $("health").innerHTML = `
      <div class="item"><div class="l">Ground-truth data</div>
        <span class="pill ${integ.verdict||'UNKNOWN'}">${integ.verdict||'—'}</span></div>
      <div class="item"><div class="l">Accumulation</div>
        <span class="pill ${cont.verdict||'UNKNOWN'}">${cont.verdict||'—'}</span></div>
      <div class="item" style="flex:1"><div class="l">Reading</div>
        <div class="why">${integ.headline||''} ${(integ.reasons||[]).join(" · ")}</div></div>`;

    // Track record — the verdict instrument. Deliberately shows the sample size next to
    // the P&L so a lucky streak never reads as an edge.
    const vcls = {POSITIVE_EDGE_EMERGING:"GREEN", NEGATIVE_EDGE_EMERGING:"RED",
                  NO_DETECTABLE_EDGE:"AMBER", INSUFFICIENT_SAMPLE:"UNKNOWN"}[perf.verdict]||"UNKNOWN";
    $("track").innerHTML = `
      <div class="item"><div class="l">Edge verdict</div>
        <span class="pill ${vcls}">${(perf.verdict||'—').replace(/_/g," ")}</span></div>
      <div class="item"><div class="l">Closed trades</div>
        <div class="mono" style="font-size:19px;font-weight:600">${perf.closed_trades} <span class="muted" style="font-size:11px">/ ${perf.min_trades_for_signal} needed</span></div></div>
      <div class="item"><div class="l">Realized</div>
        <div class="mono ${cls(perf.realized_pnl)}" style="font-size:19px;font-weight:600">${money(perf.realized_pnl||0)}</div></div>
      <div class="item"><div class="l">Total P&L</div>
        <div class="mono ${cls(perf.total_pnl)}" style="font-size:19px;font-weight:600">${money(perf.total_pnl||0)}</div>
        <div class="muted" style="font-size:11px">${perf.return_pct_on_capital ?? 0}% of capital</div></div>
      <div class="item"><div class="l">Expectancy</div>
        <div class="mono ${cls(perf.expectancy_per_trade)}" style="font-size:19px;font-weight:600">${money(perf.expectancy_per_trade||0)}</div>
        <div class="muted" style="font-size:11px">t=${perf.expectancy_t_stat ?? "—"} (need |t|>2)</div></div>
      <div class="item" style="flex:1;min-width:220px"><div class="l">Reading</div>
        <div class="why">${perf.headline||''}</div></div>`;
  }catch(e){ $("ts").textContent = "fetch error"; }
}
refresh(); setInterval(refresh, 30000);
</script>
</body>
</html>
